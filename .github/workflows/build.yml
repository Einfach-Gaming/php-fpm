name: "Build php-fpm image"

on:
  # Daily rebuild without cache to pick up PHP patch releases and OS security updates.
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/einfach-gaming/php-fpm
  # Scheduled and manual builds ignore all caches so the base image and packages are always fresh.
  FRESH_BUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  build:
    name: Build PHP ${{ matrix.php }}
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # 8.3: WoltLab Suite 6.1 (forum). 8.4: WoltLab Suite 6.2+ and other apps.
        php: ["8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: php-fpm:test
          load: true
          pull: true
          no-cache: ${{ env.FRESH_BUILD == 'true' }}
          cache-from: ${{ env.FRESH_BUILD != 'true' && format('type=gha,scope=php-{0}', matrix.php) || '' }}

      - name: Smoke test
        run: ./tests/smoke-test.sh php-fpm:test

      - name: Determine PHP patch version
        id: php
        run: echo "version=$(docker run --rm php-fpm:test php -r 'echo PHP_VERSION;')" >> "$GITHUB_OUTPUT"

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: php-fpm:test
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: Upload scan results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-php-${{ matrix.php }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.php }}
            type=raw,value=${{ steps.php.outputs.version }}
            type=raw,value=${{ steps.php.outputs.version }}-{{date 'YYYYMMDD'}}-{{sha}}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=php-fpm
            org.opencontainers.image.description=Hardened php-fpm image for WoltLab Suite and other PHP apps at Einfach Gaming
            org.opencontainers.image.version=${{ steps.php.outputs.version }}

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUSH == 'true' }}
          pull: true
          provenance: mode=max
          sbom: true
          # The amd64 image tested above is reused from the local builder cache.
          cache-from: ${{ env.FRESH_BUILD != 'true' && format('type=gha,scope=php-{0}', matrix.php) || '' }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}

      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
