[global]
log_limit = 8192

[www]
pm = ${FPM_PM}
pm.max_children = ${FPM_PM_MAX_CHILDREN}
pm.start_servers = ${FPM_PM_START_SERVERS}
pm.min_spare_servers = ${FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_PM_MAX_SPARE_SERVERS}
pm.max_requests = ${FPM_PM_MAX_REQUESTS}

; Endpoints for liveness/readiness probes and monitoring. Do not expose them through the web server.
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status
access.suppress_path[] = /fpm-ping
access.suppress_path[] = /fpm-status

; Pass environment variables (e.g. database credentials from Kubernetes) to PHP.
clear_env = no
